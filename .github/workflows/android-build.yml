name: Build Gepstorm
on:
  workflow_dispatch:
  push: { branches: [ main ] }
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r26b, add-to-path: true }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build
          cd native/third_party
          git clone --depth 1 https://github.com/ocornut/imgui
          git clone --depth 1 https://github.com/jmpews/Dobby
          mkdir -p nlohmann
          curl -L -o nlohmann/json.hpp https://github.com/nlohmann/json/releases/latest/download/json.hpp
      - run: |
          cmake -S native -B native/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build
      - uses: actions/upload-artifact@v4
        with:
          name: libgepstorm-arm64
          path: native/build/libgepstorm.so
          if-no-files-found: error
