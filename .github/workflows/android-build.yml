name: Build Gepstorm
on:
  workflow_dispatch:
  push: { branches: [ main ] }
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: r26b, add-to-path: true }
      - name: deps
        run: |
          set -x
          mkdir -p native/third_party
          cd native/third_party
          git clone --depth 1 https://github.com/ocornut/imgui
          # форк с фиксом ADRP под новый NDK
          git clone --depth 1 https://github.com/zhkl0228/Dobby
          mkdir -p nlohmann
          curl -L -o nlohmann/json.hpp https://github.com/nlohmann/json/releases/latest/download/json.hpp
      - name: patch-dobby-asm
        run: |
          set -x
          F=native/third_party/Dobby/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm
          if [ -f "$F" ]; then
            sed -i 's/@PAGE/:pg_hi21:/g; s/@PAGEOFF/:lo12:/g' "$F"
            echo "patched $F"
            grep -n 'adrp\|add x17' "$F" | head
          fi
      - name: build
        run: |
          set -x
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          cmake -S native -B native/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build
      - uses: actions/upload-artifact@v4
        with:
          name: libgepstorm-arm64
          path: native/build/libgepstorm.so
          if-no-files-found: error
